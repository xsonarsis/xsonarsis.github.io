<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xsonarsis</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0a0a0f;
        --card: #121218;
        --card2: #17171f;
        --border: #24242e;
        --text: #eceef4;
        --muted: #8b8e9a;
        --accent: #b98cff;
        --accent2: #ff8cd1;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background:
            radial-gradient(900px 500px at 50% -100px, rgba(185,140,255,0.18), transparent),
            var(--bg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 24px 12px 60px;
    }

    .page { width: 100%; max-width: 460px; }

    .banner {
        height: 170px;
        border-radius: 18px;
        background: linear-gradient(135deg, #3b2560, #602a55 55%, #252048);
        background-size: cover;
        background-position: center;
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
    }

    .banner img {
        width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .avatar-wrap {
        display: flex;
        justify-content: center;
        margin-top: -52px;
        position: relative;
        z-index: 2;
    }

    .avatar {
        width: 108px; height: 108px;
        border-radius: 50%;
        border: 4px solid var(--bg);
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 800; color: #fff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .name-row {
        display: flex; align-items: center; justify-content: center;
        gap: 8px; margin-top: 14px;
    }

    .name-row h1 { font-size: 26px; font-weight: 800; color: var(--text); }

    .badge {
        font-size: 11px; font-weight: 700;
        background: rgba(185,140,255,0.15);
        color: var(--accent);
        border: 1px solid rgba(185,140,255,0.4);
        padding: 3px 9px; border-radius: 999px;
    }

    .tags {
        display: flex; flex-wrap: wrap; gap: 6px;
        justify-content: center; margin-top: 12px;
    }

    .tag {
        font-size: 12px; color: var(--muted);
        background: var(--card2);
        border: 1px solid var(--border);
        padding: 4px 10px; border-radius: 999px;
    }

    .about {
        margin-top: 18px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
    }

    .about h2 {
        font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px;
        color: var(--muted); margin-bottom: 8px;
    }

    .about p { font-size: 14.5px; line-height: 1.6; color: #c9ccd6; }

    .section-title {
        font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px;
        color: var(--muted); margin: 22px 4px 10px;
    }

    .links { display: flex; flex-direction: column; gap: 10px; }

    .link-btn {
        display: flex; align-items: center; gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        color: var(--text);
        text-decoration: none;
        transition: border-color .15s, transform .15s, background .15s;
    }

    .link-btn:hover {
        border-color: var(--accent);
        background: var(--card2);
        transform: translateY(-2px);
    }

    .link-icon {
        width: 38px; height: 38px; flex-shrink: 0;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(185,140,255,0.12);
        font-size: 18px;
    }

    .link-text b { display: block; font-size: 14.5px; }
    .link-text span { font-size: 12.5px; color: var(--muted); }
    .link-arrow { margin-left: auto; color: var(--muted); font-size: 18px; }

    .player {
        margin-top: 22px;
        background: linear-gradient(160deg, var(--card2), var(--card));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        display: flex; align-items: center; gap: 14px;
    }

    .cover {
        width: 64px; height: 64px; flex-shrink: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent2), var(--accent));
        background-size: cover; background-position: center;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px;
        overflow: hidden;
    }

    .cover img { width: 100%; height: 100%; object-fit: cover; }

    .track-info { flex: 1; min-width: 0; }
    .track-title {
        font-size: 15px; font-weight: 700; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-artist { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

    .progress {
        height: 5px; background: #262631; border-radius: 999px;
        margin-top: 10px; cursor: pointer; overflow: hidden;
    }

    .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 999px;
    }

    .time-row {
        display: flex; justify-content: space-between;
        font-size: 11px; color: var(--muted); margin-top: 6px;
    }

    .play-btn {
        width: 52px; height: 52px; flex-shrink: 0;
        border-radius: 50%;
        border: none; cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff; font-size: 18px;
        display: flex; align-items: center; justify-content: center;
        transition: transform .15s;
    }

    .play-btn:hover { transform: scale(1.07); }

    .footer {
        text-align: center; margin-top: 28px;
        font-size: 12px; color: #565966;
    }

    .snow {
        position: fixed; top: -10px; color: rgba(255,255,255,0.5);
        font-size: 14px; pointer-events: none; animation: fall linear infinite;
    }

    @keyframes fall {
        to { transform: translateY(110vh); }
    }
</style>
</head>
<body>

<div class="page">

    <!-- БАННЕР: положи файл картинки в папку картинки/баннер.jpg -->
    <div class="banner">
        <img src="картинки/баннер.jpg" alt="" onerror="this.style.display='none'">
    </div>

    <!-- АВАТАР: картинки/аватар.png -->
    <div class="avatar-wrap">
        <div class="avatar">
            <img src="картинки/аватар.png" alt="" onerror="this.style.display='none'">
            <span id="avatar-letter" style="position:absolute">X</span>
        </div>
    </div>

    <div class="name-row">
        <h1>xsonarsis</h1>
        <span class="badge">OWNER</span>
    </div>

    <div class="about">
        <h2>О себе</h2>
        <p>xsonarsis - lua coder and Java. Concept hub boost..</p>
    </div>

    <div class="section-title">Ссылки</div>
    <div class="links">
        <!-- Меняй адреса href на свои -->
        <a class="link-btn" href="https://t.me/Sennyxdd" target="_blank">
            <div class="link-icon">✈️</div>
            <div class="link-text"><b>Telegram</b><span>напиши мне в лс</span></div>
            <div class="link-arrow">›</div>
        </a>
        <a class="link-btn" href="https://discord.com/" target="_blank">
            <div class="link-icon">🎮</div>
            <div class="link-text"><b>Discord</b><span>xalolggg123</span></div>
            <div class="link-arrow">›</div>
        </a>
    </div>

    <!-- МУЗЫКА: положи mp3 в музыка/трек.mp3 -->
    <div class="player">
        <div class="cover">
            <img src="картинки/обложка.jpg" alt="" onerror="this.style.display='none'">
            <span>♪</span>
        </div>
        <div class="track-info">
            <div class="track-title">кишлак - я у*бываю в джаз</div>
            <div class="track-artist">xsonarsis</div>
            <div class="progress" id="progress">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="time-row">
                <span id="time-current">0:00</span>
                <span id="time-total">0:00</span>
            </div>
        </div>
        <button class="play-btn" id="play-btn">▶</button>
        <audio id="audio" src="музыка/трек.mp3" preload="metadata"></audio>
    </div>

    <div class="footer">сделано в Блокноте ♥</div>
</div>

<script>
    var audio = document.getElementById('audio');
    var btn = document.getElementById('play-btn');
    var fill = document.getElementById('progress-fill');
    var bar = document.getElementById('progress');
    var cur = document.getElementById('time-current');
    var total = document.getElementById('time-total');

    function fmt(s) {
        if (isNaN(s)) return '0:00';
        var m = Math.floor(s / 60);
        var sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    btn.addEventListener('click', function () {
        if (audio.paused) {
            audio.play().catch(function () {
                alert('Положи свой mp3 в папку "музыка" с именем трек.mp3');
            });
        } else {
            audio.pause();
        }
    });

    audio.addEventListener('play', function () { btn.textContent = '❚❚'; });
    audio.addEventListener('pause', function () { btn.textContent = '▶'; });
    audio.addEventListener('loadedmetadata', function () { total.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', function () {
        fill.style.width = (audio.currentTime / audio.duration * 100 || 0) + '%';
        cur.textContent = fmt(audio.currentTime);
    });

    bar.addEventListener('click', function (e) {
        var r = bar.getBoundingClientRect();
        if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
    });

    for (var i = 0; i < 14; i++) {
        var s = document.createElement('div');
        s.className = 'snow';
        s.textContent = '❅';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.animationDuration = (4 + Math.random() * 6) + 's';
        s.style.animationDelay = (-Math.random() * 8) + 's';
        s.style.opacity = 0.2 + Math.random() * 0.5;
        document.body.appendChild(s);
    }
</script>

</body>
</html>
